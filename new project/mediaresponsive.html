<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive</title>

        <style>
           .box{
            height: 300px;
            width:90%;
        background-color: aqua; 
     }


 
              @media(width<768px) 
            {.box {
                width: 90%;
                background-color: rgb(207, 210, 41);
                
            }}

            
            @media(width:>768px;) and (width<1023px){
            .box{
                width: 90%;
                background-color:green ;
            }
        }
        </style>
    </head>
    <body>
        <div class="box">
            <div class="sbox"></div>
            <div class="sbox"></div>
            <div class="sbox"></div>
            <div class="sbox"></div>
        </div>


    </body>
    </html>
